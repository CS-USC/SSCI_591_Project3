<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SSCI Project 3</title>

    <style>
      html,
      body,
      #viewDiv {
        height: 100%;
        margin: 0;
      }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <script type="module">
      const [Map, SceneView, FeatureLayer] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js"
      ]);

      const map = new Map({
        basemap: "topo-3d",
        ground: "world-elevation"
      });

      const trails = new FeatureLayer({
        url: "https://services.arcgis.com/RmCCgQtiZLDCtblq/arcgis/rest/services/Catalina_Roads_Trails/FeatureServer/0",

        popupTemplate: {
          title: "{NAME}",
          content: [{
            type: "fields",
            fieldInfos: [
              {
                fieldName: "NAME",
                label: "Name"
              },
              {
                fieldName: "TYPE",
                label: "Road Type"
              }
            ]
          }]
        },

        renderer: {
          type: "unique-value",

          valueExpression: `
            var t = Upper(Trim($feature.TYPE));

            When(
              t == "PRIMARY ROAD", "Primary Road",
              t == "SECONDARY ROAD", "Secondary Road",
              t == "SOCIAL TRAIL", "Social Trail",
              "Other"
            )
          `,

          uniqueValueInfos: [
            {
              value: "Primary Road",
              label: "Primary Road",
              symbol: {
                type: "line-3d",
                symbolLayers: [{
                  type: "line",
                  material: {
                    color: "red"
                  },
                  size: 4
                }]
              }
            },

            {
              value: "Secondary Road",
              label: "Secondary Road",
              symbol: {
                type: "line-3d",
                symbolLayers: [{
                  type: "line",
                  material: {
                    color: "orange"
                  },
                  size: 3
                }]
              }
            },

            {
              value: "Social Trail",
              label: "Social Trail",
              symbol: {
                type: "line-3d",
                symbolLayers: [{
                  type: "line",
                  material: {
                    color: "purple"
                  },
                  size: 2
                }]
              }
            }
          ],

          defaultSymbol: {
            type: "line-3d",
            symbolLayers: [{
              type: "line",
              material: {
                color: "gray"
              },
              size: 2
            }]
          }
        }
      });

      map.add(trails);

      const view = new SceneView({
        container: "viewDiv",
        map: map,
        camera: {
          position: {
            longitude: -118.42,
            latitude: 33.30,
            z: 25000
          },
          heading: 320,
          tilt: 65
        }
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
