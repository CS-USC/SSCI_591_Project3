<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SSCI Project 3</title>

    <style>
      html,
      body,
      #viewDiv {
        height: 100%;
        margin: 0;
      }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <script type="module">
      const [Map, SceneView, FeatureLayer] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js"
      ]);

      const map = new Map({
        basemap: "topo-3d",
        ground: "world-elevation"
      });

      const trails = new FeatureLayer({
        url: "https://services.arcgis.com/RmCCgQtiZLDCtblq/arcgis/rest/services/Catalina_Roads_Trails/FeatureServer/0",

        popupTemplate: {
          title: "{NAME}",
          content: [{
            type: "fields",
            fieldInfos: [
              {
                fieldName: "NAME",
                label: "Name"
              },
              {
                fieldName: "TYPE",
                label: "Type"
              }
            ]
          }]
        }
      });

      await trails.load();

      const typeField = trails.fields.find(field => field.name === "TYPE");

      const colors = {
        "Primary Road": "red",
        "Secondary Road": "orange",
        "Minor Road": "yellow",
        "Social Trail": "purple"
      };

      const sizes = {
        "Primary Road": 5,
        "Secondary Road": 4,
        "Minor Road": 3,
        "Social Trail": 2
      };

      trails.renderer = {
        type: "unique-value",
        field: "TYPE",

        uniqueValueInfos: typeField.domain.codedValues.map(item => ({
          value: item.code,
          label: item.name,
          symbol: {
            type: "line-3d",
            symbolLayers: [{
              type: "line",
              material: {
                color: colors[item.name] || "gray"
              },
              size: sizes[item.name] || 2
            }]
          }
        })),

        defaultSymbol: {
          type: "line-3d",
          symbolLayers: [{
            type: "line",
            material: {
              color: "gray"
            },
            size: 2
          }]
        }
      };

      map.add(trails);

      const view = new SceneView({
        container: "viewDiv",
        map: map
      });

      await view.when();

      await view.goTo({
        target: trails.fullExtent.expand(1.3),
        heading: 320,
        tilt: 65
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
