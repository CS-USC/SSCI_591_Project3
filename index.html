<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SSCI Project 3</title>

    <style>
      html,
      body,
      #viewDiv {
        height: 100%;
        margin: 0;
      }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <script type="module">
      const [Map, SceneView, FeatureLayer] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js"
      ]);

      const map = new Map({
        basemap: "topo-3d",
        ground: "world-elevation"
      });

      const trails = new FeatureLayer({
        url: "https://services.arcgis.com/RmCCgQtiZLDCtblq/arcgis/rest/services/Catalina_Roads_Trails/FeatureServer/0"
      });

      await trails.load();

      const fields = trails.fields.map(field => field.name);

      const nameField = fields.find(field =>
        field.toLowerCase().includes("name")
      );

      trails.popupTemplate = {
        title: nameField ? `{${nameField}}` : "Road or Trail",
        content: [{
          type: "fields",
          fieldInfos: trails.fields
            .filter(field => field.type !== "oid" && field.type !== "geometry")
            .map(field => ({
              fieldName: field.name,
              label: field.alias
            }))
        }]
      };

      map.add(trails);

      const view = new SceneView({
        container: "viewDiv",
        map: map,
        camera: {
          position: {
            longitude: -118.42,
            latitude: 33.30,
            z: 25000
          },
          heading: 320,
          tilt: 65
        }
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
