<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SSCI Project 3</title>
    <style>
      html,
      body,
      #viewDiv {
        height: 100%;
        margin: 0;
      }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
    
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <script type="module">
      const [Map, SceneView, FeatureLayer, Legend] = await $arcgis.import([
        "@arcgis/core/Map.js",
        "@arcgis/core/views/SceneView.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/widgets/Legend.js"
      ]);

      const map = new Map({
        basemap: "topo-3d",
        ground: "world-elevation",
      });

      const roads = new FeatureLayer({
        url: "https://services.arcgis.com/RmCCgQtiZLDCtblq/arcgis/rest/services/Catalina_Roads_Trails/FeatureServer/0",

        title: "Catalina Roads and Trails",

        renderer: {
          type: "simple",
          symbol: {
            type: "simple-line",
            color: "red",
            width: 2
          }
        },

        popupTemplate: {
          title: "{NAME}",
          content: [{
            type: "fields",
            fieldInfos: [
              {
                fieldName: "NAME",
                label: "Name"
              },
              {
                fieldName: "TYPE",
                label: "Type"
              }
            ]
          }]
        }
      });

      map.add(roads);

      const view = new SceneView({
        container: "viewDiv",
        map: map,
        camera: {
          position: {
            longitude: -118.42,
            latitude: 32.825,
            z: 35000
          },
          heading: 0,
          tilt: 60
        },
      });

      const legend = new Legend({
        view: view
      });

      view.ui.add(legend, "bottom-right");
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
